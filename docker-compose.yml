version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: typhoon-ocr-db
    environment:
      - ACCEPT_EULA=${ACCEPT_EULA:-Y}
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:-YourStrong@Passw0rd}
      - MSSQL_PID=${MSSQL_PID:-Developer}
    ports:
      - "0.0.0.0:${MSSQL_PORT:-1433}:1433"
      # - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - typhoon-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P ${MSSQL_SA_PASSWORD} -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: typhoon-db-init
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./db:/scripts:ro
    environment:
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:-YourStrong@Passw0rd}
      - APP_ENV=${APP_ENV:-development}
      - ACCEPT_EULA=Y
    command: ["/bin/bash", "/scripts/init-db.sh"]
    networks:
      - typhoon-network

  adminer:
    image: adminer:latest
    container_name: typhoon-adminer
    ports:
      - "0.0.0.0:8080:8080"
    networks:
      - typhoon-network
    depends_on:
      - sqlserver

volumes:
  sqlserver_data:
    driver: local

networks:
  typhoon-network:
    driver: bridge
